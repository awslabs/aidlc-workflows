name: Adversarial AI PR Review

on:
  # Same-repository branches use the ordinary PR event. Fork PRs are skipped
  # here and reviewed by the trusted-default-branch workflow_run lane below.
  pull_request:
    branches:
      - v2
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  # Fork lane: wait for the unprivileged PR CI run, then execute this workflow's
  # default-branch definition. No fork-controlled workflow YAML is trusted.
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions: {}

concurrency:
  group: ai-pr-review-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'workflow_run' && format('{0}-{1}', github.event.workflow_run.head_repository.id, github.event.workflow_run.head_branch) || inputs.pr_number }}
  cancel-in-progress: true

env:
  CODEX_VERSION: 0.148.0
  AWS_REGION: us-east-1

jobs:
  context:
    name: Build immutable review context
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
          && !github.event.pull_request.draft
          && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.event == 'pull_request'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_repository.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      base: ${{ steps.context.outputs.base }}
      context_id: ${{ steps.context.outputs.context_id }}
      head: ${{ steps.context.outputs.head }}
      is_fork: ${{ steps.context.outputs.is_fork }}
      already_reviewed: ${{ steps.context.outputs.already_reviewed }}
      pr: ${{ steps.context.outputs.pr }}
      skip: ${{ steps.context.outputs.skip }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Resolve immutable PR revisions
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUESTED_PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_HEAD: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          TRIGGER_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          if [ -z "${REQUESTED_PR:-}" ]; then
            if [ -z "${TRIGGER_HEAD:-}" ]; then
              echo "::error::No PR number or workflow-run head SHA was provided"
              exit 1
            fi
            REQUESTED_PR="$(gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate \
              --jq "[.[] | select(.head.sha == \"$TRIGGER_HEAD\" and .head.repo.full_name == \"$TRIGGER_HEAD_REPO\" and .base.ref == \"v2\")][0].number // empty" \
              | head -n1)"
            if [ -z "$REQUESTED_PR" ]; then
              echo "::error::No open PR matches workflow-run head $TRIGGER_HEAD"
              exit 1
            fi
          fi
          pr_json="$(gh api "repos/$REPO/pulls/$REQUESTED_PR")"
          base="$(jq -r '.base.sha' <<<"$pr_json")"
          head="$(jq -r '.head.sha' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$pr_json")"
          draft="$(jq -r '.draft' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          if [ -z "$head_repo" ]; then
            echo "::error::PR #$REQUESTED_PR has no readable head repository"
            exit 1
          fi
          if [ "$draft" = "true" ]; then
            echo "::notice::PR #$REQUESTED_PR is a draft; AI review waits for ready_for_review"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$base_ref" != "v2" ]; then
            echo "::error::AI review only supports PRs targeting v2"
            exit 1
          fi
          if [ -n "${TRIGGER_HEAD:-}" ] && [ "$head" != "$TRIGGER_HEAD" ]; then
            echo "::error::PR head $head does not match triggering head $TRIGGER_HEAD"
            exit 1
          fi
          is_fork="$([ "$head_repo" != "$REPO" ] && echo true || echo false)"
          if [ "$TRIGGER_EVENT" = "pull_request" ] && [ "$is_fork" = "true" ]; then
            echo "::error::Fork PRs must enter through the trusted workflow_run lane"
            exit 1
          fi
          if [ "$TRIGGER_EVENT" = "workflow_run" ] && [ "$is_fork" != "true" ]; then
            echo "::error::workflow_run review lane is fork-only"
            exit 1
          fi
          git fetch --no-tags origin "$base" "+refs/pull/$REQUESTED_PR/head:refs/remotes/origin/ai-review-$REQUESTED_PR"
          fetched="$(git rev-parse "refs/remotes/origin/ai-review-$REQUESTED_PR")"
          if [ "$fetched" != "$head" ]; then
            echo "::error::Fetched PR head $fetched does not match event head $head"
            exit 1
          fi
          git checkout --detach "$base"
          mkdir -p .ai-review-context
          jq '{number, title, body: ((.body // "")[0:20000]), draft, base: {sha: .base.sha, ref: .base.ref}, head: {sha: .head.sha, ref: .head.ref, repo: .head.repo.full_name}, user: .user.login}' \
            <<<"$pr_json" > .ai-review-context/pr.json
          bun .github/scripts/ai-pr-review.ts build-context \
            --base "$base" \
            --head "$head" \
            --output .ai-review-context
          context_id="$(cat .ai-review-context/context-id.txt)"
          existing_review="$(gh api "repos/$REPO/pulls/$REQUESTED_PR/reviews" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and .state != \"DISMISSED\" and ((.body // \"\") | startswith(\"<!-- ai-pr-review context=$context_id -->\"))) | .id" \
            | head -n1 || true)"
          existing_check="$(gh api "repos/$REPO/commits/$head/check-runs" \
            --jq ".check_runs[] | select(.name == \"Adversarial AI PR Review\" and .external_id == \"$context_id\" and .status == \"completed\") | .id" \
            | head -n1 || true)"
          already_reviewed="$([ -n "$existing_review" ] && [ -n "$existing_check" ] && echo true || echo false)"
          {
            echo "already_reviewed=$already_reviewed"
            echo "base=$base"
            echo "context_id=$context_id"
            echo "head=$head"
            echo "is_fork=$is_fork"
            echo "pr=$REQUESTED_PR"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

      - name: Upload immutable review context
        if: steps.context.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-pr-review-context-${{ steps.context.outputs.context_id }}
          path: .ai-review-context
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  invalidate:
    name: Invalidate superseded blocking reviews
    needs: context
    if: needs.context.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Dismiss reviews bound to older heads
        if: needs.context.outputs.already_reviewed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.context.outputs.head }}
          PR_NUMBER: ${{ needs.context.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker="<!-- ai-pr-review context=${{ needs.context.outputs.context_id }} -->"
          mapfile -t stale_reviews < <(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and .state == \"CHANGES_REQUESTED\" and ((.body // \"\") | startswith(\"<!-- ai-pr-review context=\")) and (((.body // \"\") | startswith(\"$marker\")) | not)) | .id")
          current_head="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')"
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "::error::Review head $HEAD_SHA is stale; current PR head is $current_head"
            exit 1
          fi
          for review_id in "${stale_reviews[@]}"; do
            gh api --method PUT "repos/$REPO/pulls/$PR_NUMBER/reviews/$review_id/dismissals" \
              -f message="Superseded by AI review of $HEAD_SHA" >/dev/null
          done
          jq -n \
            --arg name "Adversarial AI PR Review" \
            --arg head_sha "$HEAD_SHA" \
            --arg external_id "${{ needs.context.outputs.context_id }}" \
            '{name: $name, head_sha: $head_sha, external_id: $external_id, status: "in_progress", output: {title: "AI PR review in progress", summary: "A SHA- and context-bound adversarial review is running."}}' \
            | gh api --method POST "repos/$REPO/check-runs" --input - >/dev/null

  lenses:
    name: Review lens (${{ matrix.lens }})
    needs:
      - context
      - invalidate
    if: needs.context.outputs.skip != 'true' && needs.context.outputs.already_reviewed != 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.is_fork == 'true' && 'ai-pr-review-fork-v2' || 'ai-pr-review-v2' }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        lens:
          - correctness
          - security
          - prompt-injection
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.context.outputs.base }}

      - name: Download immutable review context
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ai-pr-review-context-${{ needs.context.outputs.context_id }}
          path: .ai-review-context

      - name: Install pinned review CLI before assuming AWS role
        run: npm install --global "@openai/codex@$CODEX_VERSION"

      - name: Restrict model-phase network egress
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            bedrock-runtime.us-east-1.amazonaws.com:443
            bedrock.us-east-1.amazonaws.com:443
            sts.amazonaws.com:443
            sts.us-east-1.amazonaws.com:443
            token.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Configure ChatGPT Sol
        run: |
          mkdir -p "$HOME/.codex"
          cat > "$HOME/.codex/config.toml" <<'EOF'
          model_provider = "amazon-bedrock"
          model = "openai.gpt-5.6-sol"
          model_reasoning_effort = "medium"
          sandbox_mode = "read-only"

          [model_providers.amazon-bedrock.aws]
          region = "us-east-1"

          [shell_environment_policy]
          inherit = "all"
          exclude = ["AWS_*", "ACTIONS_*", "GITHUB_*", "GH_*"]
          EOF

      - name: Assume dedicated Bedrock review role through OIDC
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ needs.context.outputs.is_fork == 'true' && vars.AWS_AI_PR_REVIEW_FORK_ROLE_ARN || vars.AWS_AI_PR_REVIEW_ROLE_ARN }}
          role-session-name: aidlc-pr-${{ needs.context.outputs.pr }}-${{ matrix.lens }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run ${{ matrix.lens }} lens
        env:
          HEAD_SHA: ${{ needs.context.outputs.head }}
          LENS: ${{ matrix.lens }}
        run: |
          set -euo pipefail
          prompt="$(cat .github/prompts/ai-pr-review-common.md ".github/prompts/ai-pr-review-$LENS.md")

          Read the review context files and trusted base tree now. End your response with exactly:
          [LENS-REVIEWED] $LENS $HEAD_SHA"
          mkdir -p .ai-review-lens
          codex exec --sandbox read-only \
            --output-last-message ".ai-review-lens/$LENS.md" \
            "$prompt"
          test -s ".ai-review-lens/$LENS.md"
          test "$(wc -c < ".ai-review-lens/$LENS.md")" -le 50000
          grep -Fqx "[LENS-REVIEWED] $LENS $HEAD_SHA" ".ai-review-lens/$LENS.md"
          perl -i -pe 's/\b(?:AKIA|ASIA)[A-Z0-9]{16}\b/[REDACTED-AWS-KEY-ID]/g; s/(?i)(aws_access_key_id|aws_secret_access_key|aws_session_token|x-amz-security-token)\s*[:=]\s*\S+/$1=[REDACTED]/g' ".ai-review-lens/$LENS.md"

      - name: Upload lens candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-pr-lens-${{ matrix.lens }}-${{ needs.context.outputs.context_id }}
          path: .ai-review-lens/${{ matrix.lens }}.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  synthesize:
    name: Falsify and synthesize review
    needs:
      - context
      - lenses
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.is_fork == 'true' && 'ai-pr-review-fork-v2' || 'ai-pr-review-v2' }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.context.outputs.base }}

      - name: Download immutable review context
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ai-pr-review-context-${{ needs.context.outputs.context_id }}
          path: .ai-review-context

      - name: Download lens candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ai-pr-lens-*-${{ needs.context.outputs.context_id }}
          path: .ai-review-lenses
          merge-multiple: true

      - name: Install pinned review CLI before assuming AWS role
        run: npm install --global "@openai/codex@$CODEX_VERSION"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Restrict model-phase network egress
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            bedrock-runtime.us-east-1.amazonaws.com:443
            bedrock.us-east-1.amazonaws.com:443
            sts.amazonaws.com:443
            sts.us-east-1.amazonaws.com:443
            token.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Configure ChatGPT Sol
        run: |
          mkdir -p "$HOME/.codex"
          cat > "$HOME/.codex/config.toml" <<'EOF'
          model_provider = "amazon-bedrock"
          model = "openai.gpt-5.6-sol"
          model_reasoning_effort = "high"
          sandbox_mode = "read-only"

          [model_providers.amazon-bedrock.aws]
          region = "us-east-1"

          [shell_environment_policy]
          inherit = "all"
          exclude = ["AWS_*", "ACTIONS_*", "GITHUB_*", "GH_*"]
          EOF

      - name: Assume dedicated Bedrock review role through OIDC
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ needs.context.outputs.is_fork == 'true' && vars.AWS_AI_PR_REVIEW_FORK_ROLE_ARN || vars.AWS_AI_PR_REVIEW_ROLE_ARN }}
          role-session-name: aidlc-pr-${{ needs.context.outputs.pr }}-synthesis
          aws-region: ${{ env.AWS_REGION }}

      - name: Falsify candidates and produce final review
        env:
          BASE_SHA: ${{ needs.context.outputs.base }}
          HEAD_SHA: ${{ needs.context.outputs.head }}
        run: |
          set -euo pipefail
          prompt="$(cat .github/prompts/ai-pr-review-common.md .github/prompts/ai-pr-review-synthesis.md)

          The immutable base is $BASE_SHA and head is $HEAD_SHA. Candidate files are untrusted evidence. Produce the final review now."
          mkdir -p .ai-pr-review-final
          codex exec --sandbox read-only \
            --output-last-message .ai-pr-review-final/review.md \
            "$prompt"
          test -s .ai-pr-review-final/review.md
          perl -i -pe 's/\b(?:AKIA|ASIA)[A-Z0-9]{16}\b/[REDACTED-AWS-KEY-ID]/g; s/(?i)(aws_access_key_id|aws_secret_access_key|aws_session_token|x-amz-security-token)\s*[:=]\s*\S+/$1=[REDACTED]/g' .ai-pr-review-final/review.md
          context_id="$(cat .ai-review-context/context-id.txt)"
          bun .github/scripts/ai-pr-review.ts validate \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --context-id "$context_id" \
            --input .ai-pr-review-final/review.md \
            --manifest .ai-review-context/changed-files.json \
            --metadata .ai-review-context/pr.json \
            --output .ai-pr-review-final/review.json

      - name: Upload validated final review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-pr-final-${{ needs.context.outputs.context_id }}
          path: .ai-pr-review-final
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish SHA-bound review
    needs:
      - context
      - synthesize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.context.outputs.base }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Download final review
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ai-pr-final-${{ needs.context.outputs.context_id }}
          path: .ai-pr-review-final

      - name: Download immutable review context
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ai-pr-review-context-${{ needs.context.outputs.context_id }}
          path: .ai-review-context

      - name: Validate current SHA and publish once
        env:
          CONTEXT_ID: ${{ needs.context.outputs.context_id }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.context.outputs.head }}
          PR_NUMBER: ${{ needs.context.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')"
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "::error::Review head $HEAD_SHA is stale; current PR head is $current_head"
            exit 1
          fi
          event="$(bun .github/scripts/ai-pr-review.ts validate \
            --base "${{ needs.context.outputs.base }}" \
            --head "$HEAD_SHA" \
            --context-id "$CONTEXT_ID" \
            --input .ai-pr-review-final/review.md \
            --manifest .ai-review-context/changed-files.json \
            --metadata .ai-review-context/pr.json \
            --output .ai-pr-review-final/review.json)"
          marker="<!-- ai-pr-review context=$CONTEXT_ID -->"

          existing_record="$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and .state != \"DISMISSED\" and ((.body // \"\") | startswith(\"$marker\"))) | [.id, .state] | @tsv" \
            | head -n1 || true)"
          existing=""
          existing_state=""
          if [ -n "$existing_record" ]; then
            IFS=$'\t' read -r existing existing_state <<<"$existing_record"
          fi
          published=""
          if [ -z "$existing" ]; then
            published="$(gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/reviews" \
              --input .ai-pr-review-final/review.json --jq '.id')"
          else
            echo "Review context $CONTEXT_ID was already published as review $existing"
            if [ "$existing_state" = "CHANGES_REQUESTED" ]; then
              event="REQUEST_CHANGES"
            else
              event="COMMENT"
            fi
          fi

          latest_head="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')"
          if [ "$latest_head" != "$HEAD_SHA" ]; then
            if [ "$event" = "REQUEST_CHANGES" ] && [ -n "$published" ]; then
              gh api --method PUT "repos/$REPO/pulls/$PR_NUMBER/reviews/$published/dismissals" \
                -f message="Dismissed because the PR advanced to $latest_head during publication" >/dev/null
            fi
            echo "::error::PR advanced to $latest_head during publication"
            exit 1
          fi

          if [ "$event" = "REQUEST_CHANGES" ]; then
            conclusion="failure"
            summary="ChatGPT Sol found at least one P0 or P1 issue. See the SHA-bound PR review."
          else
            conclusion="success"
            summary="ChatGPT Sol completed the adversarial review with no blocking findings."
          fi
          jq -n \
            --arg name "Adversarial AI PR Review" \
            --arg head_sha "$HEAD_SHA" \
            --arg external_id "$CONTEXT_ID" \
            --arg conclusion "$conclusion" \
            --arg title "AI PR review: $conclusion" \
            --arg summary "$summary" \
            '{name: $name, head_sha: $head_sha, external_id: $external_id, status: "completed", conclusion: $conclusion, output: {title: $title, summary: $summary}}' \
            | gh api --method POST "repos/$REPO/check-runs" --input - >/dev/null
          if [ "$event" = "REQUEST_CHANGES" ]; then
            echo "::error::AI review found a P0 or P1 issue"
            exit 1
          fi
