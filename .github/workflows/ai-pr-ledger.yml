name: AIDA findings ledger

# Maintainer commands for the AIDA findings ledger: `/aida accept|reject|reopen|status|full`.
# This workflow deliberately lives apart from the review workflow. It holds no model
# credentials, assumes no cloud role, and only ever checks out the default branch, so
# the `issue_comment` trigger never exposes a PR head or a secret. Authority is the
# collaborators permission API (write, maintain, or admin), checked on every command.

on:
  issue_comment:
    types:
      - created

permissions: {}

jobs:
  command:
    name: Apply maintainer command
    if: >-
      github.event.issue.pull_request
      && github.event.comment.user.type != 'Bot'
      && github.actor != 'github-actions[bot]'
      && startsWith(github.event.comment.body, '/aida')
    concurrency:
      group: aida-ledger-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Verify permission, apply the command, update the ledger comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          # The comment body is re-read from the API by id inside the script; the
          # event payload only selects which comment to evaluate.
          bun .github/scripts/ai-pr-ledger.ts command \
            --repo "$REPO" \
            --pr "$PR_NUMBER" \
            --comment-id "$COMMENT_ID" \
            --actor "$ACTOR"
