  live_windows:
    needs: [plan, live_prepare]
    if: needs.plan.outputs.purpose != 'full-verification' && needs.plan.outputs.live_windows_required == 'true'
    runs-on: "${{ matrix.runner }}"
    environment: ai-pr-review
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 80
    defaults:
      run:
        shell: powershell
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.live_windows_matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: "${{ needs.plan.outputs.sha }}"
          persist-credentials: false
      # Pinned setup-bun supplies the broker runtime; dependencies arrive as inert artifacts.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "${{ env.BUN_VERSION }}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: "live-deps-${{ runner.os }}"
          path: "${{ runner.temp }}/live-deps"
      - name: Validate and unpack live dependencies
        run: python scripts/ci-live-deps.py unpack "$env:RUNNER_TEMP/live-deps/live-deps.tar.gz" --workspace "$env:GITHUB_WORKSPACE" --temporary "$env:RUNNER_TEMP"
      - name: "Prepare separate-user live runtime"
        run: .github/scripts/prepare-live-runtime.ps1 -Mode prepare -Family ${{ matrix.family }}
      - name: "Assume nightly Bedrock role"
        id: aws
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: "${{ secrets.AWS_AI_PR_REVIEW_ROLE_ARN }}"
          role-session-name: "aidlc-nightly-${{ matrix.slice }}-Windows"
          role-duration-seconds: 3600
          mask-aws-account-id: true
          aws-region: "${{ env.AWS_REGION }}"
          output-credentials: true
          output-env-credentials: false
      - name: "Start credential-isolated Bedrock broker"
        env:
          BROKER_ACCESS_KEY_ID: "${{ steps.aws.outputs.aws-access-key-id }}"
          BROKER_SECRET_ACCESS_KEY: "${{ steps.aws.outputs.aws-secret-access-key }}"
          BROKER_SESSION_TOKEN: "${{ steps.aws.outputs.aws-session-token }}"
        run: bun scripts/ci-start-credential-broker.ts ${{ matrix.family }}
      - name: "Assert live runner has no AWS credentials"
        run: |
          foreach ($key in @('AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY', 'AWS_SESSION_TOKEN')) {
            if (Test-Path "Env:$key") { throw "Unexpected credential environment: $key" }
          }
      - name: "Prove isolation"
        run: .github/scripts/prepare-live-runtime.ps1 -Mode prove -Family ${{ matrix.family }}
      - name: "Run claude-sdk"
        timeout-minutes: 70
        if: "matrix.family == 'claude-sdk'"
        env:
          AIDLC_CLAUDE_SDK_LIVE: "1"
        run: .github/scripts/prepare-live-runtime.ps1 -Mode run -Family claude-sdk -Shard '${{ matrix.shard }}'
      - name: "Run claude-tui"
        timeout-minutes: 70
        if: "matrix.family == 'claude-tui'"
        env:
          AIDLC_TUI_LIVE: "1"
        run: .github/scripts/prepare-live-runtime.ps1 -Mode run -Family claude-tui -Shard '${{ matrix.shard }}'
      - name: "Run codex"
        timeout-minutes: 70
        if: "matrix.family == 'codex'"
        env:
          AIDLC_CODEX_EXEC_LIVE: "1"
        run: .github/scripts/prepare-live-runtime.ps1 -Mode run -Family codex -Shard '${{ matrix.shard }}'
      - name: "Run opencode"
        timeout-minutes: 70
        if: "matrix.family == 'opencode'"
        env:
          AIDLC_OPENCODE_RUN_LIVE: "1"
        run: .github/scripts/prepare-live-runtime.ps1 -Mode run -Family opencode -Shard '${{ matrix.shard }}'
      - name: "Collect isolated live logs"
        if: "${{ always() }}"
        run: .github/scripts/prepare-live-runtime.ps1 -Mode collect -Family ${{ matrix.family }}
      - name: "Sanitize diagnostic logs"
        id: sanitize
        if: "${{ always() }}"
        env:
          AIDLC_NIGHTLY_UPLOAD_TRACES: "${{ vars.AIDLC_NIGHTLY_UPLOAD_TRACES || '1' }}"
        run: bun scripts/ci-sanitize-logs.ts tests/logs
      - name: "Upload diagnostic logs"
        if: "${{ always() && steps.sanitize.outcome == 'success' }}"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: "full-suite-live-${{ matrix.slice }}-Windows"
          path: tests/logs/
          include-hidden-files: true
  release_contract_windows:
    needs: plan
    if: needs.plan.outputs.verification_family == 'all'
    runs-on: windows-latest
    timeout-minutes: 80
    strategy:
      matrix:
        family: [release-contract]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: "${{ needs.plan.outputs.sha }}"
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "${{ env.BUN_VERSION }}"
      - run: bun install --frozen-lockfile
      - run: bun scripts/package.ts
      - name: "Run release-contract"
        timeout-minutes: 70
        env:
          AIDLC_RELEASE_CONTRACT_LIVE: "1"
        run: bun scripts/ci-live-filter.ts release-contract --platform win32 --run -- --debug -P 8
      - name: "Sanitize diagnostic logs"
        id: sanitize
        if: "${{ always() }}"
        env:
          AIDLC_NIGHTLY_UPLOAD_TRACES: "${{ vars.AIDLC_NIGHTLY_UPLOAD_TRACES || '1' }}"
        run: bun scripts/ci-sanitize-logs.ts tests/logs
      - name: "Upload diagnostic logs"
        if: "${{ always() && steps.sanitize.outcome == 'success' }}"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-suite-live-release-contract-Windows
          path: tests/logs/
          include-hidden-files: true
  result:
    if: "${{ always() }}"
    needs: [plan, native_terminal, native_reconcile, deterministic, production_guards, live_prepare, live_hosted, live_windows, release_contract_windows]
    runs-on: ubuntu-latest
    steps:
      - name: "Reject unauthorized source without executing repository code"
        if: "${{ needs.plan.result != 'success' }}"
        run: |
          echo "::error::Full-suite source authorization or planning failed"
          exit 1
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: "${{ needs.plan.result == 'success' }}"
        with:
          persist-credentials: false
          ref: "${{ needs.plan.outputs.sha }}"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: "${{ needs.plan.result == 'success' }}"
        with:
          bun-version: "${{ env.BUN_VERSION }}"
      - name: "Bind result to checked-out SHA"
        if: "${{ needs.plan.result == 'success' }}"
        run: |
          echo "FULL_SUITE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: "Require every declared leg"
        if: "${{ needs.plan.result == 'success' }}"
        env:
          FULL_SUITE_NEEDS: "${{ toJSON(needs) }}"
          FULL_SUITE_REF: "${{ inputs.ref }}"
          FULL_SUITE_PURPOSE: "${{ needs.plan.outputs.purpose }}"
          FULL_SUITE_VERIFICATION_FAMILY: "${{ needs.plan.outputs.verification_family }}"
          FULL_SUITE_VERIFICATION_TEST: "${{ needs.plan.outputs.verification_test }}"
        run: |
          bun scripts/ci-full-suite-result.ts "$RUNNER_TEMP/full-suite-result.json"
      - if: "${{ always() }}"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: "${{ needs.plan.outputs.purpose == 'live-verification' && 'full-suite-live-verification-result' || needs.plan.outputs.purpose == 'full-verification' && 'full-suite-verification-result' || 'full-suite-result' }}"
          path: "${{ runner.temp }}/full-suite-result.json"
          retention-days: 90
          if-no-files-found: error
