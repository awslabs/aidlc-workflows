name: CI

# Deterministic PR gate for the main line: contract checks (generator
# determinism, typecheck, lint), smoke, unit shards, native-terminal units,
# live OS-isolation smoke proofs, and production-guard contracts. By maintainer decision on 2026-09-21, main is
# not production: deterministic and live deep tiers gate the preview stage in
# full-suite.yml, called by preview-release.yml. Stable releases consume that
# exact-source evidence.
# See docs/reference/09-testing.md for the tier map and publication policy.
on:
  pull_request:
    branches:
      - main
    # Run on PR open, on every push to the PR branch (synchronize), and on
    # reopen. This is GitHub's default set for `pull_request`; declared
    # explicitly so the re-run-on-modify behavior is unambiguous.
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
  # The release workflow calls this gate before publishing a preview, so the
  # deterministic tiers that guard every PR also guard every preview cut from
  # main. The caller's checkout ref (main head) is what gets tested.
  workflow_call:

permissions:
  contents: read

# One in-flight run per PR ref; supersede older pushes to the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Contract checks (determinism + typecheck + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun run check` regenerates the projections, runs the two-build package
      # determinism guard, then typechecks all three tsconfigs and runs Biome.
      - name: Run contract checks
        run: bun run check

  test_smoke:
    name: Tests (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Regenerate every local projection from core/ + harness/ before the
      # tiers run, so the suite exercises CI-built bytes from a fresh clone.
      - name: Build the harness projections
        run: bun scripts/package.ts

      - name: Run smoke tier
        run: bun tests/run-tests.ts --smoke

  test_unit:
    name: Tests (unit shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Each shard receives an independent checkout. Tests stay serial inside
      # the shard, so packaging tests may regenerate dist/ without racing tests
      # that read the generated trees.
      - name: Build the harness projections
        run: bun scripts/package.ts

      # t244 syntax-checks the generated zsh completion script with `zsh -n`;
      # ubuntu-latest does not ship zsh, so install it to keep that assertion
      # exercising the real shell instead of skipping. Installing it in every
      # shard keeps assignment changes independent of runner provisioning.
      - name: Install zsh (t244 completion syntax check)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Run unit shard
        run: bun tests/run-tests.ts --unit --shard ${{ matrix.shard }}/4

  test_native_terminal:
    name: Native terminal units (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            filter: '^t-tui-(runtime|bun-process|bun-process-linux|native-private-root|native-private-root-posix|native-fixture-cleanup)$'
          - runner: macos-15
            filter: '^t-tui-(runtime|bun-process|bun-process-darwin|native-private-root|native-private-root-posix|native-fixture-cleanup)$'
          - runner: windows-latest
            filter: '^t-tui-(runtime|bun-process|native-private-root|native-private-root-windows|native-fixture-cleanup)$'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun scripts/package.ts
      # Explicit filters require executed cases in every selected file; select
      # real supervisor controls only on their owning platform.
      - run: bun tests/run-tests.ts --unit --filter '${{ matrix.filter }}'

  test_guards:
    name: Tests (production guards)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Exercise recovery with production guards
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp/ci-guard-contract"
          bash tests/run-tests.sh --debug -P 8 --production-guards --unit --integration --no-llm --filter '^(t-runner-production-guards|t-guard-recovery-production)' > "$GITHUB_WORKSPACE/tmp/ci-guard-contract/production-run.log" 2>&1

      - name: Preserve guard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-guard-evidence
          path: |
            tmp/ci-guard-contract/*.log
            tests/logs/

  test_live_isolation:
    name: Tests (live OS isolation, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun scripts/package.ts
      - name: Prepare POSIX isolated user
        if: runner.os != 'Windows'
        shell: bash
        run: bash .github/scripts/prepare-live-runtime.sh prepare isolation
      - name: Prove POSIX isolation
        if: runner.os != 'Windows'
        shell: bash
        run: bash .github/scripts/prepare-live-runtime.sh prove
      - name: Exercise POSIX isolated smoke command
        if: runner.os != 'Windows'
        shell: bash
        run: bash .github/scripts/prepare-live-runtime.sh smoke
      - name: Prepare Windows isolated user
        if: runner.os == 'Windows'
        shell: powershell
        run: .github/scripts/prepare-live-runtime.ps1 -Mode prepare -Family isolation
      - name: Prove Windows isolation
        if: runner.os == 'Windows'
        shell: powershell
        run: .github/scripts/prepare-live-runtime.ps1 -Mode prove
      - name: Exercise Windows isolated smoke command
        if: runner.os == 'Windows'
        shell: powershell
        run: .github/scripts/prepare-live-runtime.ps1 -Mode smoke

  # Preserve the existing required-check name while the work runs in isolated
  # jobs. A matrix failure collapses test_unit.result to failure.
  test:
    name: Tests (smoke + unit)
    if: ${{ always() }}
    needs: [test_smoke, test_unit, test_native_terminal, test_guards, test_live_isolation]
    runs-on: ubuntu-latest
    steps:
      - name: Require smoke, unit shards, native terminal, production guards, and live isolation
        env:
          SMOKE_RESULT: ${{ needs.test_smoke.result }}
          UNIT_RESULT: ${{ needs.test_unit.result }}
          NATIVE_RESULT: ${{ needs.test_native_terminal.result }}
          GUARD_RESULT: ${{ needs.test_guards.result }}
          ISOLATION_RESULT: ${{ needs.test_live_isolation.result }}
        run: |
          test "$SMOKE_RESULT" = "success"
          test "$UNIT_RESULT" = "success"
          test "$NATIVE_RESULT" = "success"
          test "$GUARD_RESULT" = "success"
          test "$ISOLATION_RESULT" = "success"

  changelog-guard:
    name: Changelog completeness
    # pull_request only: the guard diffs against the PR event's base commit,
    # which does not exist on workflow_dispatch or workflow_call
    # (github.base_ref is empty there).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Need the PR base commit on disk to diff CHANGELOG headings against.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      # Fail if this PR removes any `## [x.y.z]` heading that exists on the
      # base branch. Complements tests/unit/t68 (which guards version⇄changelog
      # sync and heading uniqueness, but not deletion of an existing entry).
      # Diff against the FROZEN base commit the PR event fired from
      # (pull_request.base.sha), NOT origin/<base_ref>: the branch ref moves as
      # main accrues new entries while this PR is open, which would make the guard
      # falsely report those newer entries as "removed" on any re-run.
      - name: Guard against deleted CHANGELOG entries
        run: bun scripts/ci-changelog-guard.ts "${{ github.event.pull_request.base.sha }}"
