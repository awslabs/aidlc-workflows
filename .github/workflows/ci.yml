name: CI

# Deterministic PR gate for the v2 line. Runs the fast contract checks
# (dist byte-parity, typecheck, lint), the credential-free test tiers
# (smoke + unit), and the DETERMINISTIC SUBSET of integration + e2e under
# --no-llm. The live-model tests are excluded EXPLICITLY by that flag - the
# runner force-closes every live gate and skips the derived Claude-dependent
# files by name - rather than silently passing-by-skip on a runner that
# happens to lack credentials, so a green run stays meaningful. The live
# families (Claude SDK, TUI, Kiro, Codex exec) remain local pre-merge
# concerns; see docs/reference/09-testing.md for the tier map. The
# deterministic deep tiers exist because a swarm-merge regression once
# shipped through a green smoke+unit gate: the test that caught it (t49)
# lives in the integration tier this gate previously never ran.
on:
  pull_request:
    branches:
      - v2
    # Run on PR open, on every push to the PR branch (synchronize), and on
    # reopen. This is GitHub's default set for `pull_request`; declared
    # explicitly so the re-run-on-modify behavior is unambiguous.
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

# One in-flight run per PR ref; supersede older pushes to the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Contract checks (parity + typecheck + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun run check` = package.ts --check (dist drift guard) && typecheck
      # (all three tsconfigs) && biome lint. Fails CI on a hand-edited or stale
      # dist, a type error, or a lint warning.
      - name: Run contract checks
        run: bun run check

  test:
    name: Tests (smoke + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # smoke + unit are the deterministic, credential-free tiers (no AWS /
      # Bedrock / live Claude). The runner exits non-zero on any failed file.
      - name: Run smoke + unit tiers
        run: bun tests/run-tests.ts --smoke --unit --parallel 8

  test-deep:
    name: Tests (integration + e2e, deterministic)
    runs-on: ubuntu-latest
    # Roughly 25 minutes on an 8-way local box; capped well above the expected
    # runner time so a genuine hang fails fast instead of burning the 6-hour
    # default.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # --no-llm force-closes every live-model gate (Claude SDK, TUI, Kiro
      # ACP/TUI/IDE, Codex exec) and skips the derived Claude-dependent files
      # BY NAME, so what remains is fully deterministic: the swarm/Bolt
      # referee and audit fork/merge paths (t49, t07, t134), the packaging
      # and parity contracts, and the journey/boundary suites. These are
      # exactly the tiers where a framework regression once shipped past a
      # green smoke+unit gate. Fixture git repos are hermetic (self-owned
      # config), so no runner git identity is required.
      - name: Run deterministic integration + e2e tiers
        run: bun tests/run-tests.ts --integration --e2e --no-llm --parallel 8

  changelog-guard:
    name: Changelog completeness
    # pull_request only: the guard diffs against the PR event's base commit,
    # which does not exist on workflow_dispatch (github.base_ref is empty there).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Need the PR base commit on disk to diff CHANGELOG headings against.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      # Fail if this PR removes any `## [x.y.z]` heading that exists on the
      # base branch. Complements tests/unit/t68 (which guards version⇄changelog
      # sync and heading uniqueness, but not deletion of an existing entry).
      # Diff against the FROZEN base commit the PR event fired from
      # (pull_request.base.sha), NOT origin/<base_ref>: the branch ref moves as
      # v2 accrues new entries while this PR is open, which would make the guard
      # falsely report those newer entries as "removed" on any re-run.
      - name: Guard against deleted CHANGELOG entries
        run: bun scripts/ci-changelog-guard.ts "${{ github.event.pull_request.base.sha }}"
