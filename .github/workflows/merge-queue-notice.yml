name: Merge queue runner notice

# After each merge-queue CI run, tell the PR's author when the queue dropped the
# PR only because a GitHub-hosted runner failed (lost runner, checkout that
# could not reach github.com, a runner or setup install that outlasted the
# queue's time limit). The script decides from what GitHub recorded and posts at
# most one comment per run. This workflow only checks out the default branch,
# never PR or queue code, holds no secrets, and never changes the queue.

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions: {}

jobs:
  notice:
    name: Explain a runner-only queue drop
    if: github.event.workflow_run.event == 'merge_group'
    concurrency:
      group: merge-queue-notice-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      - name: Post the notice when every cause is a runner failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun .github/scripts/merge-queue-notice.ts "$GITHUB_EVENT_PATH"
