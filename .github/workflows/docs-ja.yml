name: Deploy Japanese Documentation

on:
  push:
    branches:
      - main
    # Rebuild/deploy the Japanese site only when its sources, its config, the
    # link-rewrite step, the Python deps, or this workflow itself change.
    paths:
      - 'docs-ja/**'
      - 'zensical.ja.toml'
      - 'scripts/docs-rewrite-links.ts'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs-ja.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs-ja/**'
      - 'zensical.ja.toml'
      - 'scripts/docs-rewrite-links.ts'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs-ja.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-ja-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.28'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: uv sync --locked --group docs

      # The committed markdown keeps relative links into dist/, core/, etc. so
      # local clones navigate to the real files; the published site is built
      # from docs-ja/ only, so rewrite those links to this fork's GitHub blob
      # URLs here (in-place on the CI checkout, never committed). The script
      # exits 1 if a linked file is missing, failing the build before a dead
      # link ships.
      - name: Rewrite out-of-tree links to GitHub URLs
        env:
          AIDLC_REPO_BLOB_URL: https://github.com/kato83/aidlc-workflows/blob/main
        run: bun scripts/docs-rewrite-links.ts docs-ja

      - name: Build documentation
        run: uv run zensical build --config-file zensical.ja.toml --strict

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
