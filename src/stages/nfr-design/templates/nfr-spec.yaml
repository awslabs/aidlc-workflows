quality-targets:
  - id: NFR-1
    attribute: [performance / availability / scalability / security / reliability / observability]
    target: [specific measurable target]
    measure: [how it's measured]
    rationale: [why this number]
    source: [NFR-n from requirements]

tech-stack:
  - layer: [runtime / database / messaging / cache / framework / etc.]
    choice: [specific technology and version]
    rationale: [why — tied to which quality target]
    alternatives-considered:
      - option: [what else was considered]
        rejected-because: [why not]

patterns:
  - name: [pattern name — e.g. circuit breaker, write-behind cache, rate limiting]
    satisfies: [NFR-n]
    applied-to: [which component or interaction]
    how-it-works: [brief description in this context]
    trade-off: [what you give up]
    failure-mode: [what happens if this pattern fails]

trade-offs:
  - attribute-a: [e.g. consistency]
    attribute-b: [e.g. availability]
    decision: [which was prioritised]
    rationale: [why, given the requirements]

constraints:
  - constraint: [e.g. org standard, existing infra, team expertise]
    impact: [what it forced or ruled out]
    source: [where it comes from]
