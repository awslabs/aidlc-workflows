# dist/codex shipped config — project-scoped; copy into .codex/config.toml
# of a trusted project. Do not merge this file into ~/.codex/config.toml:
# developer_instructions carries this project's AI-DLC onboarding.

# AI-DLC Codex onboarding, injected into every session (same content as .codex/onboarding.md).
developer_instructions = '''
# AI-DLC on Codex CLI

This project uses AI-DLC (AI-Driven Development Life Cycle) under the OpenAI
Codex CLI harness (minimum version 0.145.0). Invoke the orchestrator skill with
`$aidlc` (or `/skills` → aidlc) followed by a scope or project description.
The ordered steps, the approval gates, the written record, and the checks behind
them are identical to every other AI-DLC install; only the CLI around them differs. Run
`$aidlc --status` for progress, `$aidlc --help` for usage, `$aidlc intent`
to list intents, `$aidlc --doctor` to validate setup, and
`$aidlc --stage <slug>` / `--phase <name>` / `--depth <level>` /
`--test-strategy <level>` / `--review <class>` for the usual overrides. Run `$aidlc compose
"<task>"` to get a plan tailored to that task
(up front, from a scan report via `--report <path>`, or mid-workflow to
re-shape the pending stages - every proposal stops at an approve/edit/reject
gate).

Show AI-DLC's questions and choices with their meaning unchanged, in the
person's language; Plan Approval's choice labels stay exactly as AI-DLC gives
them. When it has you wait for the person's answer or stop, say
so in your own words. Do not name, link, or quote SKILL.md or any other AI-DLC
instruction file on your own, and do not tell them a skill or rule requires
it: they started AI-DLC to be asked. When they ask about one, answer them. The
work's own files, such as a plan to approve, and a file AI-DLC asks the person
to change, such as where a setting is locked, are still named by path.

## Prerequisites

- **Codex CLI >= 0.145.0**: earlier releases defer compact-source SessionStart after a mid-turn auto-compaction, so one model continuation can run without the restored workflow mission. Releases before 0.139.0 also lack reliable subagent role attribution and hyphenated agent-TOML resolution. `$aidlc --doctor` advises on the pin. Check with `codex --version`.
- **bun**: Required for CLI tools and hook scripts (state management, audit logging, jump orchestration). Install via `curl -fsSL https://bun.sh/install | bash`. On Windows: `npm install -g bun` or `powershell -c "irm bun.sh/install.ps1 | iex"`. Its hooks run with the PATH of the terminal you start `codex` from, so `bun --version` working there is enough. If Codex runs inside an IDE opened from the dock or a desktop icon and its hooks do not run, run `bun .codex/tools/aidlc.ts doctor` in such a terminal: its Runtime hook PATH row names the directory to add and where, so dock launches work after a restart. Until then, open the IDE from that terminal.
- **Model provider**: The shipped `.codex/config.toml` does not select a provider or model. Codex keeps the provider, authentication, model, context window, and reasoning effort from your user-level configuration. Agent roles inherit that model; balanced reviewers retain only their medium reasoning-effort cap. Run `$aidlc config providers` to record the project choice and see any manual provider action.
- **MCP servers (optional)**: Codex reads MCP server definitions from `[mcp_servers.<name>]` tables in `config.toml` (project `.codex/config.toml` or `~/.codex/config.toml`). The shipped config declares none — add the servers you need there. Credentials flow through your environment; a server you have no credentials for is simply unavailable and never blocks a workflow.
- **Locking**: Audit log file locking is handled portably using mkdir-based locking in the system temp directory (no external dependencies).
- **Hook permissions**: All 17 hooks are TypeScript (`.ts`) and run via `bun`. No executable bits required — works identically on macOS, Linux, and native Windows PowerShell.
- **Permissions**: `.codex/rules/default.rules` (Starlark prefix rules) pre-allows the deterministic core's exact command prefixes — `bun .codex/tools/`, `bun .codex/hooks/`, and `git worktree`/`commit`/`add` — so workflows run without per-call prompts. The sandbox is `workspace-write`; commands outside the allowlist prompt.
- **Personal overrides**: Put machine-specific defaults (model, AWS profile/region, environment variables) in `~/.codex/config.toml` to avoid changing the shared project config. For keys supported at both levels, project-scoped settings take precedence over user-level settings, as documented in the [Codex configuration reference](https://developers.openai.com/codex/config-reference/). `developer_instructions` is single-valued: the trusted project's `.codex/config.toml` value overrides a user-level one, so do not define it in `~/.codex/config.toml` for AI-DLC projects.

## AI-DLC Structure

- **Skill**: `.agents/skills/aidlc/` — Orchestrator (`SKILL.md`), stage protocol, and the stage files across the phase directories (the enabled set depends on the composed plugins: see the compiled `.codex/tools/data/stage-graph.json` or run `bun .codex/tools/aidlc.ts --doctor`)
- **Document skill** (user-invocable): `.agents/skills/aidlc-knowledge/`, typed as `$aidlc-knowledge`; the framework CLI also exposes `bun .codex/tools/aidlc.ts engine knowledge <verb>`. Also standalone — outside the lifecycle graph — but classified `read-write`, unlike the read-only session skills below: it changes the document catalog and emits document audit events. It never advances the workflow stage pointer and never approves a gate. See "Document knowledge" under "Where things live" in the project's root `AGENTS.md` (Claude Code and Copilot readers find it under "Shared AI-DLC onboarding" in this file).
- **Session skills** (read-only, user-invocable): `.agents/skills/aidlc-session-cost/`, `.agents/skills/aidlc-replay/`, `.agents/skills/aidlc-outcomes-pack/` — typed as `$aidlc-session-cost`, `$aidlc-replay`, `$aidlc-outcomes-pack`. Each pulls every count from `bun .codex/tools/aidlc.ts engine runtime summary --json` (no LLM-side counting). Classified `read-only`: they never advance the workflow stage pointer and never emit audit events. `aidlc-session-cost` and `aidlc-replay` print to the terminal only; `aidlc-outcomes-pack` is the only one that writes a file (`OUTCOMES.md`).
- **Stage-runner skills** (user-invocable): `.agents/skills/aidlc-<stage>/`: one per runnable core stage, typed as `$aidlc-<stage>` (e.g. `$aidlc-domain-design`, `$aidlc-code-generation`); plugin-owned stages use their bare plugin-prefixed command name. Each runs that single stage in isolation via the engine's `--single` mode (`aidlc-orchestrate next --stage <slug> --single`) and **never advances your main workflow's `Current Stage`**: `next --single` records only the synthetic start boundary and `report --single` closes that same attempt. They are opt-in packaging: the same stage is reachable via `$aidlc --stage <slug> --single` without a runner. The runner set is generated from the compiled stage graph by `bun .codex/tools/aidlc.ts engine gen runners` and kept in sync by its `check` drift guard, so adding a stage file and regenerating adds its runner. The three bootstrap **initialization** stages ship no per-stage runner (they have no standalone meaning); the whole initialization phase is packaged as `$aidlc-init`: with `--scope <name>` it creates the workflow record and its starting state in one step, and with only a description it first shows the same plan offer as describing the work. (This is opt-in packaging: describing what to build normally sets up the first piece of work by itself; no separate initialization command is needed.)
- **Agents**: `.codex/agents/` — the base framework ships 14 agents: 11 domain-expert personas (product, design, delivery, architect, aws-platform, compliance, devsecops, developer, quality, pipeline-deploy, operations), 2 review-only agents (product-lead, architecture-reviewer), and the adaptive-workflows composer. A plugin install may add more; the enabled set is discovered from the files present under that directory. On Codex all 14 expert roles are transposed into `.codex/agents/` TOMLs (the `/aidlc` session reads the role `.md` bodies as prose); the four delegated stages (2.1 pipeline, 2.2 subagent, 2.4 mob, 3.5 subagent), reviewer passes, and composer requests run through Codex subagent roles.
- **Sensors**: `.codex/sensors/`: automatic checks that run on matching writes or once per existing deliverable at the approval gate. Gate-fired sensors may be advisory or blocking; blocking failures require an explicit audited override before the gate opens. Ships with framework defaults (`aidlc-claim-sources.md`, `aidlc-required-sections.md`, `aidlc-upstream-coverage.md`, `aidlc-traceability.md`, `aidlc-linter.md`, `aidlc-type-check.md`); forks may add custom `aidlc-<id>.md` manifests. Stages declare which sensors fire via the frontmatter `sensors: [<id>]` list — a pull import resolved at compile time.
- **Knowledge**: `.codex/knowledge/` — Methodology reference. Per-agent under `aidlc-<agent>-agent/` subfolders; `aidlc-shared/` holds cross-agent material. Ships with framework.
- **Tools**: `.codex/tools/`: small command-line programs (TypeScript, run via bun) that do the parts which must be exact rather than judged: tracking where the workflow is, writing the decision log, deciding what runs next (`aidlc-orchestrate.ts`, with exactly six subcommands: `next`, `continue`, `report`, `park`, `team-board`, and `wait`; `continue` is internal steering transport and `team-board` is the read-only Team Construction query, and `wait` is the bounded read-only wait for dispatched work), running the automatic checks, recording what the team learned (`aidlc-learnings.ts`), and refereeing parallel Construction work (`aidlc-swarm.ts`). All framework files prefixed `aidlc-*.ts`.
- **Hooks**: `.codex/hooks/`: scripts your CLI runs automatically at set moments, so the decision log, saved progress, and status display stay correct without anyone remembering to update them. All framework files prefixed `aidlc-*.ts`.

## Plugins

AI-DLC is open-world. Plugins under `plugins/<name>/` contribute additional stages, scopes, and agents, and `select-plugins` chooses which are enabled in this install. The counts above describe the base framework; your enabled set may differ. The compiled `.codex/tools/data/stage-graph.json` and `bun .codex/tools/aidlc.ts --doctor` are the authoritative live view of what is enabled here.

## Guards

The guards are the person's checks. When the person asks in their own words to turn one of their checks off or back on, or to change the Guard Policy ("turn the review freeze check off for this project", "stop asking me to re-approve when files change", "relax the change checks", "turn it back on"), do it for them in the same turn and say the line the command prints, word for word, in your reply in that same turn, before any question, picker or next step (the command's output alone does not reach them): never refuse, never ask them to type it, and never investigate first. Asking for the guards or the checks as a whole to be off ("turn the guards off") is Guard Policy `off`, even when the same message also names one check. "Stop asking me to re-approve when files change" is Guard Policy `relaxed`, not one check; when Guard Policy is already `off`, say in one line that it is already off and change nothing. Turning a check on, or Guard Policy `strict`, is always fine; turning one off, or Guard Policy `relaxed` or `off`, happens only when they ask, never on your own and never as a suggestion. Where it applies is what they say: this piece of work, this project, or this machine. When they say neither, use this piece of work while one is open, otherwise this project; the line names where it applied, and say in one sentence how to widen it. For this piece of work run `bun .codex/tools/aidlc.ts engine config set <key> <on|off>` with the key from the table. For this project run `bun .codex/tools/aidlc.ts config flags --bypass <switch> --local --yes` (`--global` for this machine). To turn it back on, `bun .codex/tools/aidlc.ts config flags --clear-bypass <switch> --yes` clears it everywhere it is recorded, so the check is really on; when they name a place, add `--local` or `--global` to clear only there. A `none` in the table means that place has no switch for the check: when they named no place, use the place it has; when they named a place it does not have, say in one sentence that it cannot be set there and offer the other place, and change it only when they agree. Guard Policy is set for a piece of work only; with none open, say so in one line. For Guard Policy run `bun .codex/tools/aidlc.ts engine config set guard-policy <strict|relaxed|off>`; when the team holds Guard Policy strict in memory, it refuses with one line naming the file, and you say that line. A typed `$aidlc --guard-policy off` or `$aidlc config set guard.<fence> off` was applied when the message arrived. Never edit `aidlc-state.md` or run a hook to change a guard. `$aidlc --status` shows the current Guard Policy and every fence with where its setting came from.

| Check | This piece of work: key | This project or machine: switch |
|---|---|---|
| plan approval | `plan-approval` | `AIDLC_DISABLE_PLAN_APPROVAL_GUARD` |
| review freeze | `guard.review-freeze` | `AIDLC_DISABLE_REVIEW_FREEZE_HOOK` |
| reviewer read scope | `guard.reviewer-scope` | `AIDLC_DISABLE_REVIEWER_SCOPE_HOOK` |
| state transition | `guard.state-transition` | none |
| summary confirmation | `summary-confirmation` | `AIDLC_DISABLE_SUMMARY_CONFIRMATION` |
| summary confirmation check | none | `AIDLC_SKIP_SUMMARY_CONFIRMATION_GUARD` |
| human presence | none | `AIDLC_SKIP_HUMAN_PRESENCE_GUARD` |
| stage output | none | `AIDLC_SKIP_ARTIFACT_GUARD` |
| revision backstop | none | `AIDLC_SKIP_REVISION_BACKSTOP` |
| pipeline handoff | none | `AIDLC_DISABLE_ENSEMBLE_EVIDENCE` |

## Models and effort

When someone asks in plain words to change an agent's model or effort ("make the developer agent think harder"), run `bun .codex/tools/aidlc.ts config models --agent <name> --effort <low|medium|high|xhigh|max> --project --yes`. For a model, use `--model <id>` in place of `--effort`, or both when they ask for both. Use `--local` instead of `--project` when it is only for them. If it asks for `--harness`, run it again naming this tool's harness. Print its output and stop. Never edit the `aidlc-*-agent` files for this.

## What's different on this harness

This is the same AI-DLC core that ships to every harness, rendered onto Codex CLI. On Codex:

- **Gates** render as structured questions via the `request_user_input` tool when the shipped config flags enable it, with a numbered-prose fallback otherwise. Gate semantics live in the engine either way.
- **No custom statusline and no welcome message**: workflow position rides the `update_plan` tool and `$aidlc --status`.
- **Git under the sandbox**: `workspace-write` keeps `.git` read-only in-sandbox; interactive sessions auto-escalate and `.codex/rules/default.rules` pre-allows `git worktree`/`commit`/`add`. Headless runs need `writable_roots` (template in the shipped `config.toml`).
- **Swarm floor** is `codex exec`-per-unit workers; `AIDLC_USE_SWARM=1` has no Workflow tool here and loud-degrades (`SWARM_DEGRADED`).
- **Session lifecycle**: Codex has no SessionEnd event (an unclosed session is reconciled as an inferred `SESSION_ENDED` at the next start); after compaction, Codex emits SessionStart with `source=compact`, which re-injects the workflow mission before the first post-compaction continuation (the reason Codex >= 0.145.0 is required).
- **The AIDLC method** (the layered practice files `org.md`, `team.md`, `project.md`, and the per-phase `phases/<phase>.md`) lives once at the workspace root under `aidlc/spaces/<active-space>/memory/` — the single hand-editable source of truth, identical on every harness, NOT a per-harness copy. Codex auto-merges the root `AGENTS.md` and the orchestrator injects the active-space memory paths into context on demand; AI-DLC's own stage resolver reads the same tree directly (via the `AIDLC_RULES_DIR` seam in the shipped `config.toml`). Edit the method there, never under `.codex/`. (`.codex/rules/default.rules` remains Codex's native Starlark permission-rules file — distinct from the AIDLC method, and the two must not collide.)

The Codex-specific guide (prerequisites, trust pre-seed, provider config, the git-repo requirement) is `docs/guide/harnesses/codex-cli.md`.
'''

# Model/provider: intentionally omitted. The project inherits the provider,
# authentication, model, context window, and reasoning effort selected in the
# user's Codex configuration. Agent roles also inherit that model; balanced
# reviewers retain only their medium reasoning-effort cap.

# Tool output budget. Codex cuts a shell result at 10,000 tokens (about 40 KB)
# for the models in its catalog but at 10,000 BYTES for a model it does not
# know (custom providers, --oss). AIDLC prints a workflow instruction of up to
# 28 KiB as one shell result, so the budget is raised for every model.
tool_output_token_limit = 20000

# Sandbox: workspace-write keeps <workspace>/.git read-only BY DESIGN;
# interactive sessions escalate (deny -> approve -> retry unsandboxed) and the
# shipped rules/default.rules pre-allows git worktree/commit/add prefixes so
# escalations vanish. HEADLESS runs (codex exec workers, CI, test drivers)
# cannot escalate: uncomment writable_roots with the MAIN repo's absolute
# .git path (linked worktrees resolve into <main>/.git/worktrees/*).
sandbox_mode = "workspace-write"

# Gates use Codex's structured question picker (request_user_input), which
# Codex still marks as under development; [features] below turns it on. Codex
# then warns at every start and points at ~/.codex/config.toml, so this turns
# that warning off. It also hides the warning for any other under-development
# feature while you work in this project. For numbered prose gates in one
# session, start Codex with -c features.default_mode_request_user_input=false.
suppress_unstable_features_warning = true

# The AIDLC method (the markdown rule layers: org/team/project + phases/) now
# lives at the workspace root under aidlc/spaces/<space>/memory/ — the single
# hand-editable source of truth, identical on every harness (NOT a per-harness
# copy under .codex/). The AIDLC_RULES_DIR seam below ships pointed at the
# always-present default space; /aidlc space <name> re-points it IN PLACE so
# the next session's resolver follows the active space (a byte-identical no-op at
# default). Codex also auto-merges the root AGENTS.md and the orchestrator
# injects an @aidlc/spaces/<space>/memory/... prompt mention to pull specific
# method files into context on demand. (.codex/rules/ remains Codex's native
# Starlark permission-rules dir — D-10 — distinct from the AIDLC method.)
[shell_environment_policy]
set = { AIDLC_RULES_DIR = "aidlc/spaces/default/memory" }

[sandbox_workspace_write]
network_access = true
# writable_roots = ["/absolute/path/to/main-repo/.git"]

# Delegated roles are leaves. The conductor owns every spawn and agents cannot
# recursively delegate.
[agents]
max_depth = 1

# Gates (D-3 both-track): prose gates are the floor; these flags enable the
# structured request_user_input tool (verified working at 0.137.0+; the
# default-mode flag is still under development at 0.160.0, and its start-up
# warning is turned off above).
[tools]
experimental_request_user_input = { enabled = true }

[features]
default_mode_request_user_input = true

# Statusline (D-6): predefined item IDs only; task-progress is fed by the
# update_plan tool, which the orchestrator skill keeps current per stage.
[tui]
status_line = ["model-with-reasoning", "git-branch", "task-progress", "context-used"]
