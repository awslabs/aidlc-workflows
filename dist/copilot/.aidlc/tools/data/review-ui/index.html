<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI-DLC Workflows</title>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/shell.css">
  <link rel="stylesheet" href="/assets/workflow.css">
  <link rel="stylesheet" href="/assets/document.css">
  <link rel="stylesheet" href="/assets/threads.css">
  <link rel="stylesheet" href="/assets/history.css">
  <link rel="stylesheet" href="/assets/questions.css">
  <link rel="stylesheet" href="/assets/composer.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <div id="app" class="app">
    <nav id="rail" class="rail" aria-label="App"></nav>
    <aside id="panel" class="panel" aria-label="Workflow"></aside>
    <section id="work" class="work">
      <header id="header" class="header"></header>
      <div id="notice" class="notice" role="status" hidden></div>
      <div class="body">
        <main id="main" class="main">
          <article id="viewer" class="viewer" hidden></article>
          <section id="questions-view" class="questions-view" aria-labelledby="questions-title" hidden>
            <form id="questions-form" class="questions-form">
              <h1 id="questions-title" class="questions-title">Questions</h1>
              <div id="questions-content" class="questions-content"></div>
              <p id="questions-banner" class="questions-banner" role="status" hidden></p>
              <button id="save-answers-button" class="btn primary" type="submit" hidden>Save</button>
            </form>
            <div id="guide-content" hidden>No explainer yet</div>
          </section>
          <section id="overview" class="overview" hidden></section>
          <section id="inbox" class="inbox" hidden></section>
          <section id="empty" class="empty-state"></section>
        </main>
        <aside id="slot" class="slot" aria-label="Panel" hidden></aside>
      </div>
    </section>
  </div>
  <div id="search" class="palette" role="dialog" aria-label="Search or jump" hidden></div>
  <div id="paused-overlay" class="paused-overlay" role="status">Live updates paused — reconnecting…</div>
</body>
</html>
