[theme]
name = "material"
language = "ja"
features = [
  "navigation.sidebar",
  "navigation.sections",
  "navigation.top",
  "search.suggest",
  "content.code.copy",
]

[[theme.palette]]
scheme = "default"
primary = "indigo"
accent = "cyan"
[theme.palette.toggle]
icon = "material/brightness-7"
name = "ダークモードに切り替え"

[[theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "cyan"
[theme.palette.toggle]
icon = "material/brightness-4"
name = "ライトモードに切り替え"

[markdown_extensions]
admonition = {}

[markdown_extensions."pymdownx.details"]

# install ドキュメントのハーネスごとの <details> ドロップダウンのように、
# markdown="1" を持つ HTML ブロックの中の Markdown を描画する。GitHub は
# この属性を無視し、同じブロックをそのまま描画する。
[markdown_extensions.md_in_html]

[markdown_extensions."pymdownx.superfences"]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
