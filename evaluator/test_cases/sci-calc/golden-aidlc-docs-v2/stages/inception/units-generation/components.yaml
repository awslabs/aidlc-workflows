Component:
  Id: CMP-008
  Name: "API Layer"
  Unit: UNIT-001
  Behaviour-summary: "Receives HTTP requests, validates input schemas via Pydantic models, routes to the appropriate engine component, and formats all responses into the standard envelope. Handles error translation, unknown endpoints, and unexpected exceptions."
  Responsibilities:
    - "Define and expose HTTP endpoints per the API specification"
    - "Validate request bodies against schemas (Pydantic)"
    - "Route requests to the correct engine component by URL path"
    - "Format success and error responses into the standard response envelope"
    - "Override FastAPI's default validation error handler (422 → INVALID_INPUT envelope)"
    - "Handle unknown endpoints and operations (NOT_FOUND)"
    - "Catch unexpected exceptions and return structured INTERNAL_ERROR"
    - "Expose health-check endpoint"
  Boundaries:
    - "Does not contain math computation logic — delegates all computation to engine components"
    - "Does not define business rules or domain constraints"
    - "Does not handle authentication or rate-limiting"
  Source:
    Requirements:
      - FR-17
      - FR-18
      - FR-19
      - FR-20
      - FR-21
    Stories:
      - S-14
      - S-15
      - S-16
      - S-17
  Dependency:
    - Component:
          Id: CMP-001
          Name: "Arithmetic Engine"
          Interaction: "Routes arithmetic operation requests for computation"
    - Component:
          Id: CMP-002
          Name: "Powers Engine"
          Interaction: "Routes power/root operation requests for computation"
    - Component:
          Id: CMP-003
          Name: "Trigonometry Engine"
          Interaction: "Routes trigonometry operation requests for computation"
    - Component:
          Id: CMP-004
          Name: "Logarithmic Engine"
          Interaction: "Routes logarithmic operation requests for computation"
    - Component:
          Id: CMP-005
          Name: "Statistics Engine"
          Interaction: "Routes statistics operation requests for computation"
    - Component:
          Id: CMP-006
          Name: "Constants Provider"
          Interaction: "Routes constants lookup requests to this provider"
    - Component:
          Id: CMP-007
          Name: "Conversions Engine"
          Interaction: "Routes unit conversion requests for computation"
  Dependent-Component: []
  Entities:
    ENT-011:
      Name: "SuccessResponse"
      Description: "Standard success envelope returned to clients"
      Attributes:
        - "status"
        - "operation"
        - "inputs"
        - "result"
    ENT-012:
      Name: "ErrorResponse"
      Description: "Standard error envelope returned to clients"
      Attributes:
        - "status"
        - "operation"
        - "inputs"
        - "error_code"
        - "error_message"
