Component:
  Id: CMP-001
  Name: "Arithmetic Engine"
  Unit: UNIT-001
  Behaviour-summary: "Performs basic arithmetic operations on numeric inputs — addition, subtraction, multiplication, division, modulo, absolute value, and negation. Detects and reports division-by-zero conditions."
  Responsibilities:
    - "Execute binary arithmetic operations (add, subtract, multiply, divide, modulo)"
    - "Execute unary arithmetic operations (abs, negate)"
    - "Detect and signal division-by-zero conditions"
  Boundaries:
    - "Does not handle powers, roots, or any non-basic arithmetic"
    - "Does not handle HTTP concerns or response formatting"
  Source:
    Requirements:
      - FR-1
      - FR-2
    Stories:
      - S-1
      - S-2
  Dependency: []
  Dependent-Component:
    - Component:
          Id: CMP-008
          Name: "API Layer"
          Interaction: "API Layer routes arithmetic requests to this engine for computation"
  Entities:
    ENT-001:
      Name: "BinaryOperands"
      Description: "A pair of numeric values for binary arithmetic operations"
      Attributes:
        - "a"
        - "b"
    ENT-002:
      Name: "UnaryOperand"
      Description: "A single numeric value for unary arithmetic operations"
      Attributes:
        - "a"

---

Component:
  Id: CMP-002
  Name: "Powers Engine"
  Unit: UNIT-001
  Behaviour-summary: "Computes power, square, square root, cube root, and nth root operations. Enforces domain constraints for negative inputs under even roots and detects overflow."
  Responsibilities:
    - "Execute power and root operations (power, square, sqrt, cbrt, nth_root)"
    - "Validate domain constraints (negative inputs for even roots, n=0)"
    - "Detect overflow conditions (result is infinite from finite input)"
  Boundaries:
    - "Does not handle logarithms or exponential function"
    - "Does not handle HTTP concerns"
  Source:
    Requirements:
      - FR-3
      - FR-4
    Stories:
      - S-3
      - S-4
  Dependency: []
  Dependent-Component:
    - Component:
          Id: CMP-008
          Name: "API Layer"
          Interaction: "API Layer routes power/root requests to this engine for computation"
  Entities:
    ENT-003:
      Name: "PowerOperands"
      Description: "Base and exponent for power/exponentiation operations"
      Attributes:
        - "base"
        - "exponent"
    ENT-004:
      Name: "NthRootOperands"
      Description: "Value and root degree for nth root computation"
      Attributes:
        - "a"
        - "n"

---

Component:
  Id: CMP-003
  Name: "Trigonometry Engine"
  Unit: UNIT-001
  Behaviour-summary: "Computes trigonometric and hyperbolic functions with support for degree/radian angle unit conversion. Enforces domain constraints for inverse functions."
  Responsibilities:
    - "Execute trigonometric functions (sin, cos, tan, asin, acos, atan, atan2)"
    - "Execute hyperbolic functions (sinh, cosh, tanh, asinh, acosh, atanh)"
    - "Convert between degrees and radians for input/output"
    - "Validate domain constraints for inverse trig functions (asin/acos range, acosh >= 1, |atanh| < 1)"
  Boundaries:
    - "Does not handle general unit conversions between measurement systems (that's CMP-007)"
    - "Does not handle HTTP concerns"
  Source:
    Requirements:
      - FR-5
      - FR-6
      - FR-7
    Stories:
      - S-5
      - S-6
  Dependency: []
  Dependent-Component:
    - Component:
          Id: CMP-008
          Name: "API Layer"
          Interaction: "API Layer routes trigonometry requests to this engine"
  Entities:
    ENT-005:
      Name: "TrigOperands"
      Description: "Angle value with unit specification for trigonometric computation"
      Attributes:
        - "a"
        - "angle_unit"
    ENT-006:
      Name: "Atan2Operands"
      Description: "Two-argument arctangent inputs with angle unit"
      Attributes:
        - "y"
        - "x"
        - "angle_unit"

---

Component:
  Id: CMP-004
  Name: "Logarithmic Engine"
  Unit: UNIT-001
  Behaviour-summary: "Computes logarithmic (natural log, log10, log2, arbitrary-base log) and exponential (exp) operations. Enforces domain constraints and detects overflow."
  Responsibilities:
    - "Execute logarithmic operations (ln, log10, log2, arbitrary-base log)"
    - "Execute exponential function (exp)"
    - "Validate domain constraints (non-positive inputs, invalid bases: base <= 0 or base = 1)"
    - "Detect overflow on exp"
  Boundaries:
    - "Does not handle powers or roots (that's CMP-002)"
    - "Does not handle HTTP concerns"
  Source:
    Requirements:
      - FR-8
      - FR-9
    Stories:
      - S-7
      - S-8
  Dependency: []
  Dependent-Component:
    - Component:
          Id: CMP-008
          Name: "API Layer"
          Interaction: "API Layer routes logarithmic requests to this engine"
  Entities:
    ENT-007:
      Name: "LogOperands"
      Description: "Value and optional base for logarithmic computation"
      Attributes:
        - "a"
        - "base"

---

Component:
  Id: CMP-005
  Name: "Statistics Engine"
  Unit: UNIT-001
  Behaviour-summary: "Computes descriptive statistics over numeric arrays — central tendency, dispersion, and aggregation — with minimum element validation and deterministic tie-breaking."
  Responsibilities:
    - "Compute mean, median, mode, min, max, sum, count"
    - "Compute sample and population standard deviation and variance (stdev, variance, pstdev, pvariance)"
    - "Validate minimum element count constraints per operation"
    - "Resolve mode ties deterministically (return smallest value)"
  Boundaries:
    - "Does not perform inferential statistics, regression, or probability distributions"
    - "Does not persist data between requests"
  Source:
    Requirements:
      - FR-10
      - FR-11
    Stories:
      - S-9
      - S-10
  Dependency: []
  Dependent-Component:
    - Component:
          Id: CMP-008
          Name: "API Layer"
          Interaction: "API Layer routes statistics requests to this engine"
  Entities:
    ENT-008:
      Name: "StatisticsInput"
      Description: "A list of numeric values for statistical computation"
      Attributes:
        - "values"

---

Component:
  Id: CMP-006
  Name: "Constants Provider"
  Unit: UNIT-001
  Behaviour-summary: "Provides named mathematical constants (pi, e, tau, inf, nan, golden_ratio, sqrt2, ln2, ln10) as a read-only registry, individually or as a complete map."
  Responsibilities:
    - "Serve individual named constants by name"
    - "Serve all constants as a map"
    - "Validate constant name existence and return NOT_FOUND for unknown names"
  Boundaries:
    - "Does not compute anything — purely serves predefined static values"
    - "Does not handle HTTP concerns"
  Source:
    Requirements:
      - FR-13
      - FR-14
    Stories:
      - S-12
  Dependency: []
  Dependent-Component:
    - Component:
          Id: CMP-008
          Name: "API Layer"
          Interaction: "API Layer routes constants lookup requests to this provider"
  Entities:
    ENT-009:
      Name: "Constant"
      Description: "A named mathematical constant with its fixed numeric value"
      Attributes:
        - "name"
        - "value"

---

Component:
  Id: CMP-007
  Name: "Conversions Engine"
  Unit: UNIT-001
  Behaviour-summary: "Converts numeric values between units within supported categories: angle, temperature, length, and weight. Validates unit names within each category."
  Responsibilities:
    - "Convert angle units (degrees, radians, gradians)"
    - "Convert temperature units (celsius, fahrenheit, kelvin)"
    - "Convert length units (meters, feet, inches, centimeters, millimeters, kilometers, miles, yards)"
    - "Convert weight units (kilograms, pounds, ounces, grams, milligrams, tonnes, stones)"
    - "Validate unit names and category membership"
  Boundaries:
    - "Does not handle cross-category conversions or compound conversions"
    - "Does not handle trigonometric angle mode (CMP-003 does its own degree/radian conversion internally)"
    - "Does not handle HTTP concerns"
  Source:
    Requirements:
      - FR-15
      - FR-16
    Stories:
      - S-13
  Dependency: []
  Dependent-Component:
    - Component:
          Id: CMP-008
          Name: "API Layer"
          Interaction: "API Layer routes unit conversion requests to this engine"
  Entities:
    ENT-010:
      Name: "ConversionInput"
      Description: "A unit conversion request specifying value, source unit, and target unit within a category"
      Attributes:
        - "value"
        - "from_unit"
        - "to_unit"
        - "category"

