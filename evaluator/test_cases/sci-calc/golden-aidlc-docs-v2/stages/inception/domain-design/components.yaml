Component:
  Id: CMP-008
  Name: "API Router"
  Behaviour-summary: "Receives HTTP requests, validates input schemas via Pydantic models, dispatches to the appropriate engine component, and wraps results in the standard success/error response envelope. Handles error translation, unknown endpoint responses, and the health-check endpoint."
  Responsibilities:
    - "Define and expose HTTP endpoints per the API specification"
    - "Validate request bodies via Pydantic schemas"
    - "Dispatch operations to the correct engine component based on URL path"
    - "Format success responses into the standard envelope"
    - "Translate engine exceptions (domain error, division-by-zero, overflow) into structured error responses"
    - "Override FastAPI's default 422 validation error handler to use the error envelope"
    - "Handle unknown endpoints (NOT_FOUND)"
    - "Catch unexpected exceptions and return INTERNAL_ERROR"
    - "Expose health-check endpoint"
    - "Serve constants endpoint via Constants Provider"
  Boundaries:
    - "Does not contain math computation logic — delegates all computation to engine components"
    - "Does not own business rules or domain constraints (engines enforce those)"
    - "Does not handle authentication or rate-limiting"
  Source:
    Requirements:
      - FR-envelope
      - FR-errors
      - FR-health
    Stories:
      - S-20
      - S-21
      - S-22
      - S-23
  Dependency:
    - Component:
        Id: CMP-001
        Name: "Arithmetic Engine"
        Interaction: "Dispatches arithmetic operation requests and receives results"
    - Component:
        Id: CMP-002
        Name: "Powers Engine"
        Interaction: "Dispatches power/root operation requests and receives results"
    - Component:
        Id: CMP-003
        Name: "Trigonometry Engine"
        Interaction: "Dispatches trigonometry operation requests and receives results"
    - Component:
        Id: CMP-004
        Name: "Logarithmic Engine"
        Interaction: "Dispatches logarithmic operation requests and receives results"
    - Component:
        Id: CMP-005
        Name: "Statistics Engine"
        Interaction: "Dispatches statistics operation requests and receives results"
    - Component:
        Id: CMP-006
        Name: "Constants Provider"
        Interaction: "Dispatches constant lookup requests and receives results"
    - Component:
        Id: CMP-007
        Name: "Conversions Engine"
        Interaction: "Dispatches unit conversion requests and receives results"
  Dependent-Component: []
  Entities:
    ENT-011:
      Name: "SuccessResponse"
      Description: "Standard success envelope returned to clients for all successful operations"
      Attributes:
        - "status"
        - "operation"
        - "inputs"
        - "result"
    ENT-012:
      Name: "ErrorResponse"
      Description: "Standard error envelope returned to clients for all failure cases"
      Attributes:
        - "status"
        - "operation"
        - "inputs"
        - "error_code"
        - "error_message"
