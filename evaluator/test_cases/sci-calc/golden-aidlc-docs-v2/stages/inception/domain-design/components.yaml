Component:
  Id: CMP-005
  Name: "Statistics Engine"
  Behaviour-summary: "Computes descriptive statistics over collections of numeric values — mean, median, mode, stdev, variance, pstdev, pvariance, min, max, sum, count — with minimum element count validation and deterministic mode tie-breaking."
  Responsibilities:
    - "Compute central tendency measures (mean, median, mode)"
    - "Compute dispersion measures (stdev, variance, pstdev, pvariance)"
    - "Compute aggregation measures (min, max, sum, count)"
    - "Validate minimum element count per operation (1 for most, 2 for sample stdev/variance)"
    - "Resolve mode ties (return smallest value)"
  Boundaries:
    - "Does not perform inferential statistics, regression, or probability distributions"
    - "Does not store data — computes on each request"
  Source:
    Requirements:
      - FR-statistics
    Stories:
      - S-11
      - S-12
  Dependency: []
  Dependent-Component:
    - Component:
        Id: CMP-008
        Name: "API Router"
        Interaction: "API Router dispatches statistics operation requests to this engine and receives results or domain errors"
  Entities:
    ENT-008:
      Name: "ValuesInput"
      Description: "A list of numeric values for statistical computation"
      Attributes:
        - "values"

---

Component:
  Id: CMP-006
  Name: "Constants Provider"
  Behaviour-summary: "Serves mathematical constants — pi, e, tau, inf, nan, golden_ratio, sqrt2, ln2, ln10 — both individually by name and as a complete map. Purely a lookup service with no computation."
  Responsibilities:
    - "Return individual named constants by name"
    - "Return all constants as a map"
    - "Validate constant name existence and return NOT_FOUND for unknown names"
  Boundaries:
    - "Does not compute anything — only serves predefined static values"
    - "Does not handle HTTP concerns"
  Source:
    Requirements:
      - FR-constants
    Stories:
      - S-13
      - S-14
  Dependency: []
  Dependent-Component:
    - Component:
        Id: CMP-008
        Name: "API Router"
        Interaction: "API Router dispatches constant lookup requests to this provider"
  Entities:
    ENT-009:
      Name: "Constant"
      Description: "A named mathematical constant with its numeric value"
      Attributes:
        - "name"
        - "value"

---

Component:
  Id: CMP-007
  Name: "Conversions Engine"
  Behaviour-summary: "Converts numeric values between units within supported categories — angle, temperature, length, and weight — using defined conversion factors and formulas. Validates that from_unit and to_unit are recognized within the specified category."
  Responsibilities:
    - "Convert between angle units (degrees, radians, gradians)"
    - "Convert between temperature units (celsius, fahrenheit, kelvin)"
    - "Convert between length units (meters, feet, inches, centimeters, millimeters, kilometers, miles, yards)"
    - "Convert between weight units (kilograms, pounds, ounces, grams, milligrams, tonnes, stones)"
    - "Validate unit names within each category"
    - "Report errors for unsupported unit combinations"
  Boundaries:
    - "Does not handle angle conversion for trigonometry (CMP-003 handles its own degree/radian conversion internally)"
    - "Does not support currency, time, or other non-physical unit categories"
    - "Does not handle HTTP concerns"
  Source:
    Requirements:
      - FR-conversions
    Stories:
      - S-15
      - S-16
      - S-17
      - S-18
      - S-19
  Dependency: []
  Dependent-Component:
    - Component:
        Id: CMP-008
        Name: "API Router"
        Interaction: "API Router dispatches unit conversion requests to this engine and receives results or validation errors"
  Entities:
    ENT-010:
      Name: "ConversionInput"
      Description: "A value with source and target units for conversion within a category"
      Attributes:
        - "value"
        - "from_unit"
        - "to_unit"

