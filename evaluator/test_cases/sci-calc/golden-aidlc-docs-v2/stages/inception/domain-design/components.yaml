Component:
  Id: CMP-001
  Name: "Arithmetic Engine"
  Behaviour-summary: "Performs basic arithmetic operations on numeric inputs — addition, subtraction, multiplication, division, modulo, absolute value, and negation. Detects and reports division-by-zero conditions."
  Responsibilities:
    - "Execute binary arithmetic operations (add, subtract, multiply, divide, modulo)"
    - "Execute unary arithmetic operations (abs, negate)"
    - "Detect and signal division-by-zero conditions"
  Boundaries:
    - "Does not handle powers, roots, or any non-basic arithmetic"
    - "Does not handle HTTP concerns or response envelope formatting"
  Source:
    Requirements:
      - FR-arithmetic
    Stories:
      - S-1
      - S-2
  Dependency: []
  Dependent-Component:
    - Component:
        Id: CMP-008
        Name: "API Router"
        Interaction: "API Router dispatches arithmetic operation requests to this engine and receives computed results or domain errors"
  Entities:
    ENT-001:
      Name: "BinaryOperands"
      Description: "A pair of numeric values for binary arithmetic operations"
      Attributes:
        - "a"
        - "b"
    ENT-002:
      Name: "UnaryOperand"
      Description: "A single numeric value for unary arithmetic operations"
      Attributes:
        - "a"

---

Component:
  Id: CMP-002
  Name: "Powers Engine"
  Behaviour-summary: "Computes powers, squares, and roots — power, sqrt, cbrt, nth_root, square — with domain validation for negative inputs under even roots and overflow detection for large exponents."
  Responsibilities:
    - "Execute exponentiation (power, square)"
    - "Execute root extraction (sqrt, cbrt, nth_root)"
    - "Validate domain constraints (negative input for even root, n=0)"
    - "Detect overflow (result is infinite from finite input)"
  Boundaries:
    - "Does not handle logarithms or exponential function (that's Logarithmic Engine)"
    - "Does not handle HTTP concerns"
  Source:
    Requirements:
      - FR-powers
    Stories:
      - S-3
      - S-4
  Dependency: []
  Dependent-Component:
    - Component:
        Id: CMP-008
        Name: "API Router"
        Interaction: "API Router dispatches power/root operation requests to this engine and receives results or domain errors"
  Entities:
    ENT-003:
      Name: "PowerOperands"
      Description: "Base and exponent for power/exponentiation operation"
      Attributes:
        - "base"
        - "exponent"
    ENT-004:
      Name: "NthRootOperands"
      Description: "Value and root degree for nth_root operation"
      Attributes:
        - "a"
        - "n"

---

Component:
  Id: CMP-003
  Name: "Trigonometry Engine"
  Behaviour-summary: "Computes trigonometric and hyperbolic functions with configurable angle units (degrees/radians) and domain validation for inverse functions."
  Responsibilities:
    - "Execute standard trig functions (sin, cos, tan)"
    - "Execute inverse trig functions (asin, acos, atan, atan2)"
    - "Execute hyperbolic functions (sinh, cosh, tanh, asinh, acosh, atanh)"
    - "Convert between degrees and radians for input/output based on angle_unit parameter"
    - "Validate domain constraints (asin/acos: -1<=a<=1, acosh: a>=1, atanh: -1<a<1)"
  Boundaries:
    - "Does not handle angle unit conversion as a standalone service (that's Conversions Engine)"
    - "Does not handle HTTP concerns"
  Source:
    Requirements:
      - FR-trigonometry
    Stories:
      - S-5
      - S-6
      - S-7
  Dependency: []
  Dependent-Component:
    - Component:
        Id: CMP-008
        Name: "API Router"
        Interaction: "API Router dispatches trigonometry operation requests to this engine and receives results or domain errors"
  Entities:
    ENT-005:
      Name: "TrigOperands"
      Description: "Angle value with unit specification for trigonometric computation"
      Attributes:
        - "a"
        - "angle_unit"
    ENT-006:
      Name: "Atan2Operands"
      Description: "Two-argument arctangent inputs with angle unit"
      Attributes:
        - "y"
        - "x"
        - "angle_unit"

---

Component:
  Id: CMP-004
  Name: "Logarithmic Engine"
  Behaviour-summary: "Computes logarithmic and exponential functions — ln, log10, log2, arbitrary-base log, exp — with domain validation for non-positive inputs and invalid bases, and overflow detection for exp."
  Responsibilities:
    - "Execute standard logarithms (ln, log10, log2)"
    - "Execute arbitrary-base logarithm"
    - "Execute exponential function (exp)"
    - "Validate domain constraints (a <= 0 for log, base <= 0 or base = 1 for arbitrary log)"
    - "Detect overflow on exp for large values"
  Boundaries:
    - "Does not handle powers or roots (that's Powers Engine)"
    - "Does not handle HTTP concerns"
  Source:
    Requirements:
      - FR-logarithms
    Stories:
      - S-8
      - S-9
      - S-10
  Dependency: []
  Dependent-Component:
    - Component:
        Id: CMP-008
        Name: "API Router"
        Interaction: "API Router dispatches logarithmic operation requests to this engine and receives results or domain errors"
  Entities:
    ENT-007:
      Name: "LogOperands"
      Description: "Value and optional base for logarithmic computation"
      Attributes:
        - "a"
        - "base"

