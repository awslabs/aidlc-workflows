- id: ENT-006
  name: "TrigInput"
  component-id: CMP-003
  component-name: "Trigonometry Engine"
  description: "Input for standard and hyperbolic trigonometric functions"
  source:
    requirements: [FR-3]
    stories: [S-3]
  attributes:
    - name: "a"
      type: "float"
      required: true
    - name: "angle_unit"
      type: "enum"
      required: false
      values: ["radians", "degrees"]
      default: "radians"
  constraints: []
  relationships: []

