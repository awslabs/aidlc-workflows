- id: ENT-010
  name: "StatisticsInput"
  component-id: CMP-005
  component-name: "Statistics Engine"
  description: "Input containing a list of numeric values for statistical operations"
  source:
    requirements: [FR-5]
    stories: [S-5]
  attributes:
    - name: "values"
      type: "array[float]"
      required: true
      min: 1
      constraints: "Non-empty array of numbers; stdev/variance require at least 2 elements"
  constraints:
    - "Empty array is invalid input"
  relationships: []

---

- id: ENT-011
  name: "ConversionInput"
  component-id: CMP-006
  component-name: "Conversions Engine"
  description: "Input for unit conversion operations"
  source:
    requirements: [FR-6]
    stories: [S-6]
  attributes:
    - name: "value"
      type: "float"
      required: true
      constraints: "Any finite number"
    - name: "from_unit"
      type: "string"
      required: true
      constraints: "Must be a valid unit within the requested category"
    - name: "to_unit"
      type: "string"
      required: true
      constraints: "Must be a valid unit within the requested category"
  constraints:
    - "from_unit and to_unit must belong to the same category as the URL path"
  relationships: []

---

- id: ENT-012
  name: "SuccessResponse"
  component-id: CMP-007
  component-name: "API Router"
  description: "Standard envelope wrapping all successful operation results"
  source:
    requirements: [FR-7]
    stories: [S-7]
  attributes:
    - name: "status"
      type: "string"
      required: true
      values: ["ok"]
    - name: "operation"
      type: "string"
      required: true
      constraints: "Name of the operation that was executed"
    - name: "inputs"
      type: "object"
      required: true
      constraints: "Echo of the request inputs as received"
    - name: "result"
      type: "float | object"
      required: true
      constraints: "Computed result — number for single-value operations, object for multi-value"
  constraints: []
  relationships: []

---

- id: ENT-013
  name: "ErrorResponse"
  component-id: CMP-007
  component-name: "API Router"
  description: "Standard envelope wrapping all operation errors"
  source:
    requirements: [FR-8]
    stories: [S-7]
  attributes:
    - name: "status"
      type: "string"
      required: true
      values: ["error"]
    - name: "operation"
      type: "string"
      required: true
    - name: "inputs"
      type: "object"
      required: true
    - name: "error"
      type: "object"
      required: true
      constraints: "Contains 'code' and 'message' fields"
    - name: "error.code"
      type: "enum"
      required: true
      values: ["INVALID_INPUT", "DIVISION_BY_ZERO", "DOMAIN_ERROR", "OVERFLOW", "NOT_FOUND", "INTERNAL_ERROR"]
    - name: "error.message"
      type: "string"
      required: true
      constraints: "Human-readable explanation of the error"
  constraints: []
  relationships: []

---

- id: ENT-014
  name: "Constant"
  component-id: CMP-007
  component-name: "API Router"
  description: "A named mathematical constant returned by the constants endpoint"
  source:
    requirements: [FR-9]
    stories: [S-8]
  attributes:
    - name: "name"
      type: "string"
      required: true
      values: ["pi", "e", "tau", "inf", "nan", "golden_ratio", "sqrt2", "ln2", "ln10"]
    - name: "value"
      type: "float"
      required: true
  constraints: []
  relationships: []
