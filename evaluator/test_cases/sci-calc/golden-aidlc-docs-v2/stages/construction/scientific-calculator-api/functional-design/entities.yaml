- id: ENT-009
  name: "LogBaseInput"
  component-id: CMP-004
  component-name: "Logarithmic Engine"
  description: "Input for arbitrary-base logarithm"
  source:
    requirements: [FR-4]
    stories: [S-4]
  attributes:
    - name: "a"
      type: "float"
      required: true
      constraints: "Must be > 0"
    - name: "base"
      type: "float"
      required: true
      constraints: "Must be > 0 and != 1"
  constraints:
    - "Domain error if a <= 0, base <= 0, or base == 1"
  relationships: []

