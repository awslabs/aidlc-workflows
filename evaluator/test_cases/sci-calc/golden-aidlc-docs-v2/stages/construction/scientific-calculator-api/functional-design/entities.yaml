- id: ENT-005
  name: "NthRootInput"
  component-id: CMP-002
  component-name: "Powers Engine"
  description: "Input for nth_root operation"
  source:
    requirements: [FR-2]
    stories: [S-2]
  attributes:
    - name: "a"
      type: "float"
      required: true
    - name: "n"
      type: "integer"
      required: true
      constraints: "Must be non-zero integer"
  constraints:
    - "n must not be 0"
    - "Domain error if a < 0 and n is even"
  relationships: []

