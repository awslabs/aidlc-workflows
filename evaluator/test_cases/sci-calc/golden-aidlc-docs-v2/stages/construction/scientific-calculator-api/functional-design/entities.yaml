- id: ENT-001
  name: "BinaryArithmeticInput"
  component-id: CMP-001
  component-name: "Arithmetic Engine"
  description: "Input for binary arithmetic operations (add, subtract, multiply, divide, modulo)"
  source:
    requirements: [FR-1]
    stories: [S-1]
  attributes:
    - name: "a"
      type: "float"
      required: true
      constraints: "Any finite number"
    - name: "b"
      type: "float"
      required: true
      constraints: "Any finite number"
  constraints: []
  relationships: []

